# Render demo edge (nginx). Public origin for the temporary demo only.
# Mirrors docker/Caddyfile routing: /api/* -> backend (/api/v1), else -> frontend.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 30m;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server {
        listen 10000;
        server_name _;

        # Upstreams are public Render hostnames over HTTPS. Host must match each service's
        # TRUSTED_HOSTS / Next.js host, so it is set explicitly. X-Forwarded-Proto is fixed to https
        # because Render terminates TLS here; the backend then sees https and FORCE_HTTPS is satisfied.
        location /api/ {
            proxy_pass https://logu-backend.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name logu-backend.onrender.com;
            proxy_set_header Host logu-backend.onrender.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass https://logu-frontend.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name logu-frontend.onrender.com;
            proxy_set_header Host logu-frontend.onrender.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
    }
}
