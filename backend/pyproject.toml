[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# These SQL tests intentionally construct suspicious SQL fragments to prove that guarded paths reject them.
"tests/sql/**" = ["S603", "S607", "S608"]
# These two fixtures are imported for pytest's fixture registry/re-export behavior.
"tests/integration/test_finance_flows.py" = ["F811"]
