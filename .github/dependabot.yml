version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      backend-non-major:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "backend"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      frontend-non-major:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "frontend"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      container-non-major:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "containers"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      frontend-container-non-major:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "containers"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
