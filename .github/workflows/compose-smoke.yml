name: Compose runtime smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Start the complete stack and verify readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare isolated test secrets
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python - <<'PY'
          import base64
          import secrets
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text().splitlines()
          password = secrets.token_hex(32)
          replacements = {
              'ENVIRONMENT': 'test',
              'POSTGRES_PASSWORD': password,
              'DATABASE_URL': f'postgresql+psycopg://logu:{password}@db:5432/logu_cfo',
              'SITE_ADDRESS': 'http://localhost',
              'TRUSTED_HOSTS': 'localhost,127.0.0.1',
              'SECURITY_HMAC_KEY': secrets.token_hex(32),
              'DATA_ENCRYPTION_KEY': base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              'ENABLE_BOOTSTRAP': 'false',
              'BOOTSTRAP_TOKEN': '',
              'FORCE_HTTPS': 'false',
              'COOKIE_SECURE': 'false',
              'EDGE_BIND_ADDRESS': '127.0.0.1',
              'AI_PROVIDER': 'disabled',
              'NOTIFICATION_PROVIDER': 'disabled',
          }
          written = set()
          output = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0].strip()
                  if key in replacements:
                      output.append(f'{key}={replacements[key]}')
                      written.add(key)
                      continue
              output.append(line)
          missing = set(replacements) - written
          if missing:
              raise SystemExit(f'Missing expected .env template keys: {sorted(missing)}')
          path.write_text('\n'.join(output) + '\n')
          PY
          chmod 600 .env
          docker compose config --quiet

      - name: Build and start the complete stack
        run: docker compose up -d --build

      - name: Verify backend readiness and public frontend route
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 180); do
            if docker compose exec -T backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3); assert r.status == 200" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 4
          done
          if [[ "$ready" != "1" ]]; then
            docker compose ps
            docker compose logs --no-color --tail=200
            echo 'Backend did not become ready within 12 minutes.' >&2
            exit 1
          fi
          page=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ -o /tmp/logu-home.html; then
              page=1
              break
            fi
            sleep 2
          done
          if [[ "$page" != "1" ]] || ! grep -qi '<html' /tmp/logu-home.html; then
            docker compose ps
            docker compose logs --no-color --tail=200
            echo 'Frontend route did not return an HTML page.' >&2
            exit 1
          fi
          echo 'Compose runtime smoke test passed: database migration, backend readiness, and frontend edge route.'

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop test stack
        if: always()
        run: docker compose down --remove-orphans
