name: Import Logu AI CFO source and validate

on:
  push:
    branches: [main]
    paths:
      - "Logu-AI-CFO-clean-upload.zip"
      - ".github/workflows/project-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-validate:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'Import Logu AI CFO project source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logu
          POSTGRES_PASSWORD: logu-ci-test-password
          POSTGRES_DB: logu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logu -d logu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Safely restore source files from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="Logu-AI-CFO-clean-upload.zip"
          if [[ -f "$archive" ]]; then
            python - <<'PY'
from pathlib import Path, PurePosixPath
from zipfile import ZipFile
import shutil
import stat

archive = Path("Logu-AI-CFO-clean-upload.zip")
root = Path.cwd().resolve()
blocked_parts = {
    ".git", ".github", "node_modules", ".next", "__pycache__",
    ".pytest_cache", ".ruff_cache", ".venv", "venv", "__pypackages__",
}
blocked_names = {"credentials.json", "secrets.json", ".neon_url.txt"}
total = 0
restored = 0
with ZipFile(archive) as z:
    infos = z.infolist()
    if sum(i.file_size for i in infos) > 50 * 1024 * 1024:
        raise SystemExit("Refusing an archive exceeding the 50 MiB source limit.")
    for info in infos:
        if info.is_dir():
            continue
        rel = PurePosixPath(info.filename)
        if rel.is_absolute() or not rel.parts or any(p in {"", ".", ".."} for p in rel.parts):
            raise SystemExit(f"Unsafe archive path rejected: {info.filename!r}")
        if stat.S_ISLNK(info.external_attr >> 16):
            print(f"Skipping symlink: {info.filename}")
            continue
        if any(p in blocked_parts for p in rel.parts):
            continue
        name = rel.name
        if name in blocked_names:
            print(f"Skipping sensitive/local file: {info.filename}")
            continue
        if name == ".env" or (name.startswith(".env.") and name != ".env.example"):
            print(f"Skipping environment secret file: {info.filename}")
            continue
        if name.endswith((".pem", ".key", ".pyc", ".pyo")):
            print(f"Skipping sensitive/generated file: {info.filename}")
            continue
        target = (root / Path(*rel.parts)).resolve()
        if root not in target.parents:
            raise SystemExit(f"Archive path escaped repository root: {info.filename!r}")
        target.parent.mkdir(parents=True, exist_ok=True)
        with z.open(info) as src, target.open("wb") as dst:
            shutil.copyfileobj(src, dst)
        total += info.file_size
        restored += 1
print(f"Restored {restored} source files ({total:,} bytes); archive paths and secret patterns were filtered.")
PY
          else
            echo "Source archive is absent; validating the existing repository."
          fi

          if [[ -f frontend/package.json ]]; then
            if (cd frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); then
              echo "Frontend package-lock.json generated."
            else
              echo "::warning::Unable to generate frontend/package-lock.json; frontend CI will show the blocker."
            fi
          fi

          if [[ -f frontend/package.json && -f backend/requirements.txt ]]; then
            rm -f "$archive"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Import Logu AI CFO project source"
            git push origin HEAD:main
          fi

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check app tests alembic

      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests/unit -t .

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://logu:logu-ci-test-password@localhost:5432/logu_test
        run: python -m pytest tests/integration -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend
