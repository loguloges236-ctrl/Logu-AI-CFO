name: Backend, frontend, and deployment validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logu
          POSTGRES_PASSWORD: logu-ci-test-password
          POSTGRES_DB: logu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logu -d logu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f backend/requirements-dev.txt ]]; then
            python -m pip install -r backend/requirements-dev.txt
          elif [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
            python -m pip install ruff pytest psycopg[binary]
          elif [[ -f backend/pyproject.toml ]]; then
            python -m pip install -e "backend[dev]"
          else
            echo "No backend dependency manifest found." >&2
            exit 1
          fi

      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

      - name: Run Ruff
        if: ${{ hashFiles('backend/app/**/*.py') != '' && hashFiles('backend/tests/**/*.py') != '' }}
        working-directory: backend
        run: python -m ruff check app tests alembic

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/tests/unit/**/*.py') != '' }}
        working-directory: backend
        run: python -m unittest discover -s tests/unit -t .

      - name: Run PostgreSQL integration tests
        if: ${{ hashFiles('backend/tests/integration/**/*.py') != '' }}
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://logu:logu-ci-test-password@localhost:5432/logu_test
        run: python -m pytest tests/integration -q

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        # The current npm advisory database has no patched upstream braces release; it is dev-only via ESLint tooling.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run build --if-present

      - name: Validate operational shell scripts
        shell: bash
        run: bash -n scripts/backup.sh scripts/restore.sh

      - name: Validate Docker Compose configuration
        if: ${{ hashFiles('docker-compose.yml') != '' || hashFiles('compose.yml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f .env.example ]] && cp .env.example .env || touch .env
          docker compose config --quiet

      - name: Build application images
        if: ${{ hashFiles('docker-compose.yml') != '' || hashFiles('compose.yml') != '' }}
        run: docker compose build backend frontend
