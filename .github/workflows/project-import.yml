name: Import Logu AI CFO source and validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-validate:
    if: ${{ github.event_name != 'push' || (github.event.head_commit.message != 'Import Logu AI CFO project source' && github.event.head_commit.message != 'Apply Ruff autofixes' && github.event.head_commit.message != 'Refresh frontend dependency lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logu
          POSTGRES_PASSWORD: logu-ci-test-password
          POSTGRES_DB: logu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logu -d logu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore clean project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Logu-AI-CFO-clean-upload.zip ]]; then
            python .github/scripts/import_project_zip.py
            if [[ -f frontend/package.json && ! -f frontend/package-lock.json ]]; then
              (cd frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            fi
            if [[ -f frontend/package.json && ( -f backend/requirements-dev.txt || -f backend/requirements.txt || -f backend/pyproject.toml ) ]]; then
              rm -f Logu-AI-CFO-clean-upload.zip
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No source changes needed."
            else
              git commit -m "Import Logu AI CFO project source"
              git push origin HEAD:main
            fi
          else
            echo "Source was already imported; validating repository files."
          fi

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f backend/requirements-dev.txt ]]; then
            python -m pip install -r backend/requirements-dev.txt
          elif [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
            python -m pip install ruff pytest psycopg[binary]
          elif [[ -f backend/pyproject.toml ]]; then
            python -m pip install -e "backend[dev]"
          else
            echo "No backend dependency manifest found." >&2
            exit 1
          fi

      - name: Apply Ruff autofixes and commit source cleanups
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if python -m ruff check app tests alembic --fix --unsafe-fixes; then
            echo "No Ruff autofixes needed."
          else
            echo "Ruff found remaining diagnostics after all configured automatic fixes."
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No lint-driven source changes to commit."
          else
            git commit -m "Apply Ruff autofixes"
            git push origin HEAD:main
          fi

      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

      - name: Run Ruff
        if: ${{ hashFiles('backend/app/**/*.py') != '' && hashFiles('backend/tests/**/*.py') != '' }}
        working-directory: backend
        run: python -m ruff check app tests alembic

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/tests/unit/**/*.py') != '' }}
        working-directory: backend
        run: python -m unittest discover -s tests/unit -t .

      - name: Run PostgreSQL integration tests
        if: ${{ hashFiles('backend/tests/integration/**/*.py') != '' }}
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://logu:logu-ci-test-password@localhost:5432/logu_test
        run: python -m pytest tests/integration -q

      - name: Refresh frontend lockfile for pinned packages
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend lockfile already matches package.json."
          else
            git commit -m "Refresh frontend dependency lockfile"
            git push origin HEAD:main
          fi

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        # The current npm advisory database has no patched upstream braces release; it is dev-only via ESLint tooling.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run build --if-present

      - name: Validate Docker Compose configuration
        if: ${{ hashFiles('docker-compose.yml') != '' || hashFiles('compose.yml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f .env.example ]] && cp .env.example .env || touch .env
          docker compose config --quiet

      - name: Build application images
        if: ${{ hashFiles('docker-compose.yml') != '' || hashFiles('compose.yml') != '' }}
        run: docker compose build backend frontend
