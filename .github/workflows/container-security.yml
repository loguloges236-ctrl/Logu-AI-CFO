name: Container security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; scheduled and main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-scan:
    name: Build and scan application images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build backend image
        run: docker build --pull -t logu-ai-cfo-backend:scan ./backend

      - name: Build frontend image
        run: docker build --pull -t logu-ai-cfo-frontend:scan ./frontend

      - name: Scan backend image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logu-ai-cfo-backend:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logu-ai-cfo-frontend:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Informational only: HIGH findings are listed in the log so they can be triaged, but they do not
      # fail the job. CRITICAL findings above remain the blocking gate. These steps run even when the
      # gate fails so the full picture is visible.
      - name: Report HIGH findings in backend image (informational)
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logu-ai-cfo-backend:scan
          format: table
          vuln-type: os,library
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Report HIGH findings in frontend image (informational)
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logu-ai-cfo-frontend:scan
          format: table
          vuln-type: os,library
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
