# Phase 1 stack. Network isolation:
#   public : only the edge (caddy) is attached; it publishes ports on EDGE_BIND_ADDRESS
#   app    : internal (no internet route) - caddy, frontend, backend
#   data   : internal - backend, migrate, database, malware scanner
#   updates: outbound-only egress for ClamAV signature refresh; no ports are published
# The database and scanner are never published to the host.
name: logu-ai-cfo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logu_cfo
      POSTGRES_USER: logu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logu -d logu_cfo"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt: ["no-new-privileges:true"]
    networks: [data, updates]

  migrate:
    build: ./backend
    image: logu-ai-cfo-backend:local
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://logu:${POSTGRES_PASSWORD}@db:5432/logu_cfo
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  # One-shot: creates or refreshes the least-privilege runtime role logu_app (database/roles/provision_roles.sql).
  # Runs as the bootstrap superuser `logu`. Idempotent. The password is piped to psql's prompt, never on the command line.
  provision-app-role:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (at least 16 characters)}
    volumes:
      - ./database/roles:/roles:ro
    command: ["sh", "-c", "printf '%s\\n' \"$$APP_DB_PASSWORD\" | psql -X -v ON_ERROR_STOP=1 -h db -U logu -d logu_cfo -f /roles/provision_roles.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  backend:
    image: logu-ai-cfo-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Runtime role: owns nothing, DML only. Migrations stay on `logu` (see migrate).
      DATABASE_URL: postgresql+psycopg://logu_app:${APP_DB_PASSWORD}@db:5432/logu_cfo
      UPLOAD_STORAGE_PATH: /var/lib/logu-ai-cfo/uploads
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Only the edge container may supply X-Forwarded-* headers. Must match caddy's fixed address below.
      TRUSTED_PROXY_NETWORKS: 172.28.10.10/32
      # The frontend container calls the API directly on the private network (server-side rendering).
      # This host name is accepted only for requests that did NOT pass through the trusted proxy.
      INTERNAL_API_HOSTS: backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      provision-app-role:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - uploads_data:/var/lib/logu-ai-cfo/uploads
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app, data]

  frontend:
    build:
      context: ./frontend
    image: logu-ai-cfo-frontend:local
    restart: unless-stopped
    environment:
      # Server-side only. Deliberately NOT a NEXT_PUBLIC_ variable.
      API_INTERNAL_URL: http://backend:8000
    depends_on: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:8080:80"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:8443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    networks:
      public: {}
      app:
        ipv4_address: 172.28.10.10

volumes:
  postgres_data:
  clamav_db:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  public: {}
  # ClamAV needs outbound HTTPS/DNS to refresh malware signatures. No ports are published;
  # this network is attached only to ClamAV and cannot be reached by app services.
  updates: {}
